# Render Blueprint — CalmMama Village (Expo web)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: calmmama-village
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && NODE_ENV=production npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Set in Render dashboard (sync: false = secret / manual entry)
      - key: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: EXPO_PUBLIC_RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: EXPO_PUBLIC_GEMINI_API_KEY
        sync: false
