# Daytime village web-push dispatch (Hobby Vercel only allows 1×/day crons).
# Runs every 15 minutes so kitchen / midday / afternoon / evening slots can fire.
name: Village push dispatch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due village reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DISPATCH_URL: ${{ secrets.VILLAGE_PUSH_DISPATCH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing CRON_SECRET repository secret"
            exit 1
          fi
          URL="${DISPATCH_URL:-https://calmmamavillage.com/api/web-push/dispatch}"
          curl -fsS -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
